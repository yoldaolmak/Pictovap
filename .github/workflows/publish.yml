name: Publish to PyPI

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'release-request.json'

concurrency:
  group: pictovap-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate exact release identity
        id: identity
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          module = ast.parse(Path("src/pictovap/__init__.py").read_text())
          declared = [ast.literal_eval(node.value) for node in module.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == "__version__"
                              for target in node.targets)]
          assert declared == [version], "Package version mismatch"
          ref = os.environ["RELEASE_REF"]
          if ref == "refs/heads/main":
              request = json.loads(Path("release-request.json").read_text())
              assert request == {"version": version}, "Explicit release request mismatch"
          else:
              assert ref == "refs/tags/v" + version, "Tag version mismatch"
          assert Path("docs/release-notes/v" + version + ".md").is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run test suite
        run: python -m pytest tests/unit/

  build-n-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Verify clean wheel installation
        env:
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" -c 'import os; from importlib.metadata import version; from pictovap import sample_visual_plan, build_decision_pack, validate_decision_pack; assert version("pictovap") == os.environ["RELEASE_VERSION"]; assert validate_decision_pack(build_decision_pack(sample_visual_plan()))["status"] == "passed"'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: [test, build-n-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release for the tested and published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          existing=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n "$existing" ]]; then
            target=$(printf '%s\n' "$existing" | tail -1 | cut -f1)
            test "$target" = "$GITHUB_SHA"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release already exists for the tested commit"
              exit 0
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Pictovap $tag" --notes-file "docs/release-notes/$tag.md"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Pictovap $tag" --notes-file "docs/release-notes/$tag.md"
          fi
